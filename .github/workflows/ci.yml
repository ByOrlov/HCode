name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install shards
        run: shards install

      - name: Spec
        run: |
          LINK_FLAGS="$(./scripts/build_miniaudio.sh)"
          crystal spec --warnings none --no-color --link-flags "$LINK_FLAGS"
