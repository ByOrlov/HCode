name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (YYYY.MM.DD or YYYY.MM.DD.N)"
        required: true

permissions:
  contents: write

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version (auto-increment build number per day)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Resolve the raw tag pushed (or the dispatch input).
          if [ -n "${{ inputs.version }}" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          echo "Pushed tag: $RAW"

          # YYYY.MM.DD form → compute next build number for today.
          if [[ "$RAW" =~ ^([0-9]{4})\.([0-9]{2})\.([0-9]{2})$ ]]; then
            DAY="${BASH_REMATCH[0]}"
            # Find existing release tags for this day and pick the max N.
            EXISTING=$(git tag -l "${DAY}.*" 2>/dev/null || true)
            MAX=0
            if [ -n "$EXISTING" ]; then
              for t in $EXISTING; do
                n=$(echo "$t" | awk -F. '{print $4}')
                n=${n:-0}
                if [ "$n" -gt "$MAX" ] 2>/dev/null; then MAX=$n; fi
              done
            fi
            # Also check the GitHub releases API (covers tags pushed then deleted).
            LATEST_API=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 2>/dev/null || true)
            if echo "$LATEST_API" | grep -qE "${DAY}\."; then
              for t in $(echo "$LATEST_API" | grep -oE "${DAY}\.[0-9]+"); do
                n=$(echo "$t" | awk -F. '{print $4}')
                if [ "$n" -gt "$MAX" ] 2>/dev/null; then MAX=$n; fi
              done
            fi
            N=$((MAX + 1))
            VERSION="${DAY}.${N}"
          elif [[ "$RAW" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            VERSION="$RAW"
          else
            echo "::error::Tag '$RAW' does not match YYYY.MM.DD or YYYY.MM.DD.N"
            exit 1
          fi

          echo "Final version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: compute-version
    runs-on: ${{ matrix.runner }}
    env:
      HCODE_VERSION: ${{ needs.compute-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-darwin
            runner: macos-latest
            archive: tar.gz
            cross_target: x86_64-apple-darwin
          - target: aarch64-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-windows
            runner: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Set up x86_64 libraries (macOS cross-compile)
        if: matrix.cross_target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          NONINTERACTIVE=1 arch -x86_64 /bin/bash -c \
            "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          /usr/local/bin/brew install libyaml pcre2 openssl@3
          echo "PKG_CONFIG_PATH=/usr/local/opt/openssl@3/lib/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          shards install
          TARGET_ARGS=()
          if [ -n "${{ matrix.cross_target }}" ]; then
            TARGET_ARGS+=(--target "${{ matrix.cross_target }}")
            TARGET_ARGS+=(--link-flags "-arch x86_64 -L/usr/local/lib -L/usr/local/opt/openssl@3/lib")
          fi
          crystal build src/hcode.cr -o hcode --release --no-debug --warnings none "${TARGET_ARGS[@]}"
          if [ -f hcode.exe ]; then ./hcode.exe --version; else ./hcode --version; fi

      # ---- Archive + upload ----
      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf "hcode-${{ matrix.target }}.tar.gz" hcode

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path hcode.exe -DestinationPath "hcode-${{ matrix.target }}.zip"

      - name: Generate SHA256
        shell: bash
        run: sha256sum hcode-${{ matrix.target }}.*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hcode-${{ matrix.target }}
          path: hcode-${{ matrix.target }}.*

  release:
    needs: [compute-version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.compute-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum hcode-* > ../hcode-checksums.txt
          cat ../hcode-checksums.txt

      - name: Create tag (if short form was pushed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            artifacts/hcode-*
            hcode-checksums.txt
